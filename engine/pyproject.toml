[project]
name = "investor-engine"
version = "0.1.0"
description = "Research, backtest, and paper-trade engine for GenInvestor. L2 ceiling — no live execution."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Opt-in only. Each of these pulls real weight onto a disk that is currently tight.
market = ["yfinance>=0.2.40"]
crypto = ["ccxt>=4.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
investor = "investor_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investor_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # long lines are caught by the formatter, not worth failing a build over

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]  # tests reach into _split_indices on purpose
